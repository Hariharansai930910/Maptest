<!DOCTYPE html>
<html>
<head>
  <title>Pin Drop Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 5px #999;
      font-family: sans-serif;
      font-size: 14px;
      max-width: 80%;
    }
  </style>
</head>
<body>

<div id="info">Click on the map to drop a pin 📍</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').fitWorld();

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
  }).addTo(map);

  map.locate({ setView: true, maxZoom: 16 });

  let pinMarker;

  function getAddress(lat, lng) {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`;
    
    fetch(url)
      .then(response => response.json())
      .then(data => {
        const address = data.display_name || 'Address not found';
        document.getElementById('info').innerHTML =
          `<strong>📍 Lat:</strong> ${lat.toFixed(5)}<br>
           <strong>📍 Lng:</strong> ${lng.toFixed(5)}<br>
           <strong>🏠 Address:</strong> ${address}`;
      })
      .catch(err => {
        document.getElementById('info').innerText = 'Error fetching address';
        console.error(err);
      });
  }

  map.on('click', function (e) {
    const { lat, lng } = e.latlng;

    if (pinMarker) {
      pinMarker.setLatLng(e.latlng);
    } else {
      pinMarker = L.marker(e.latlng).addTo(map);
    }

    getAddress(lat, lng);
  });
</script>

</body>
</html>
